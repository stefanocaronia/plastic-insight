name: Build and Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Release builds are infrequent; avoid retaining multi-GiB Rider SDK caches.
          cache-disabled: true

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Select-String -Path gradle.properties -Pattern '^version=').Line.Split('=', 2)[1]
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match plugin version $version."
          }

      - name: Test and package
        shell: pwsh
        run: .\gradlew.bat test buildPlugin verifyPluginProjectConfiguration verifyPluginStructure --no-daemon

      # A tag never releases an unsigned archive; a manual run without the secrets skips signing.
      - name: Sign and verify signature
        shell: pwsh
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          if (-not $env:CERTIFICATE_CHAIN -or -not $env:PRIVATE_KEY) {
            if ($env:GITHUB_REF.StartsWith('refs/tags/')) {
              throw 'CERTIFICATE_CHAIN and PRIVATE_KEY secrets are required to release a tag.'
            }
            Write-Host 'Signing secrets are not available; the archive stays unsigned.'
            exit 0
          }
          .\gradlew.bat signPlugin --no-daemon
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\gradlew.bat verifyPluginSignature --no-daemon
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload plugin package
        uses: actions/upload-artifact@v7
        with:
          name: plastic-insight-${{ github.sha }}
          path: build/distributions/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download plugin package
        uses: actions/download-artifact@v8
        with:
          name: plastic-insight-${{ github.sha }}
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/*-signed.zip --verify-tag --generate-notes --title "Plastic Insight $GITHUB_REF_NAME"
